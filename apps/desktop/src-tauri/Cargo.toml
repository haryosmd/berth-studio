[package]
name = "berth-studio"
description = "Berth Studio desktop app (Tauri shell and IPC commands)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "berth-studio"
path = "src/main.rs"

[build-dependencies]
# Exact pins: versions are chosen at least 7 days after release (see docs/DEPENDENCIES.md).
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
berth-core = { path = "../../../crates/berth-core" }
berth-mongo = { path = "../../../crates/berth-mongo" }
berth-postgres = { path = "../../../crates/berth-postgres" }
berth-secrets = { path = "../../../crates/berth-secrets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.1", features = [] }
# rustls for TLS (no OpenSSL) and the macOS proxy settings; the zip feature is only for Windows installers.
tauri-plugin-updater = { version = "=2.13.2", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Only for the native Save dialog of exports, called from Rust; the webview gets none of its commands.
tauri-plugin-dialog = { version = "=2.8.3", default-features = false }
tokio = { version = "1.47", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.47", default-features = false, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true

name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Found a security issue?** Do not open an issue. Report it privately as described in SECURITY.md.
        Never paste passwords, tokens, connection strings with credentials, or production data here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Berth Studio version or commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and database version
      placeholder: macOS 26.1, PostgreSQL 16.4
    validations:
      required: true

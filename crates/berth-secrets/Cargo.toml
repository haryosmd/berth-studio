[package]
name = "berth-secrets"
description = "Where Berth Studio keeps passwords: the operating system's secret store, never a file."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# keyring-core plus one platform store, as the keyring maintainers recommend for applications:
# it pulls in far less than the all-in-one `keyring` crate.
keyring-core = "1"
thiserror = "2.0.21"
zeroize = "1.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[lints]
workspace = true

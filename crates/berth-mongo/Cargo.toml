[package]
name = "berth-mongo"
description = "MongoDB driver for Berth Studio: catalog, documents, aggregation and guarded writes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
berth-core = { path = "../berth-core" }
# Default features: rustls-tls (no OpenSSL) and dns-resolver (needed for mongodb+srv).
mongodb = "3.9.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.47", default-features = false, features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1.47", default-features = false, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
